<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="po-t po-d">
  <title id="po-t">三條路徑的出處比較</title>
  <desc id="po-d">prompt-to-UI 與 screenshot-to-UI 沒有可稽核出處;document-to-UI 的畫面是文件的投影</desc>
  <rect width="1280" height="720" fill="#fdfaf1"/>
  <defs>
    <marker id="a-gray" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a89e87"/></marker>
    <marker id="a-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4a3f30"/></marker>
    <marker id="a-rust" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7a2e1f"/></marker>
  </defs>

  <!-- Row 1: prompt-to-UI -->
  <text x="64" y="72" font-family="'IBM Plex Mono',Menlo,monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#a89e87">01 &#183; PROMPT &#8594; UI</text>
  <g font-family="'Noto Sans TC','PingFang TC',sans-serif">
    <rect x="64" y="92" width="220" height="64" fill="#fdfaf1" stroke="#d2c8b0" stroke-width="1.5"/>
    <text x="174" y="124" font-size="19" fill="#7a6a55" text-anchor="middle">靈感 + 一句 prompt</text>
    <line x1="284" y1="124" x2="380" y2="124" stroke="#a89e87" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a-gray)"/>
    <rect x="384" y="92" width="150" height="64" fill="#fdfaf1" stroke="#d2c8b0" stroke-width="1.5"/>
    <text x="459" y="124" font-size="19" fill="#7a6a55" text-anchor="middle">畫面</text>
    <text x="574" y="118" font-size="18" fill="#a89e87">出處:無。改第二輪就飄,審不了</text>
    <text x="574" y="144" font-size="18" font-weight="700" fill="#a89e87">= slop</text>
  </g>

  <!-- Row 2: screenshot-to-UI -->
  <text x="64" y="234" font-family="'IBM Plex Mono',Menlo,monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#a89e87">02 &#183; SCREENSHOT &#8594; UI</text>
  <g font-family="'Noto Sans TC','PingFang TC',sans-serif">
    <rect x="64" y="254" width="220" height="64" fill="#fdfaf1" stroke="#d2c8b0" stroke-width="1.5"/>
    <text x="174" y="286" font-size="19" fill="#7a6a55" text-anchor="middle">別人的截圖</text>
    <line x1="284" y1="286" x2="380" y2="286" stroke="#a89e87" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a-gray)"/>
    <rect x="384" y="254" width="150" height="64" fill="#fdfaf1" stroke="#d2c8b0" stroke-width="1.5"/>
    <text x="459" y="286" font-size="19" fill="#7a6a55" text-anchor="middle">畫面</text>
    <text x="574" y="280" font-size="18" fill="#a89e87">出處:別人的設計判斷,</text>
    <text x="574" y="306" font-size="18" fill="#a89e87">不是你產品的</text>
  </g>

  <!-- Row 3: document-to-UI (highlighted) -->
  <rect x="40" y="380" width="1200" height="300" fill="#f7f3ea" stroke="#7a2e1f" stroke-width="2"/>
  <text x="64" y="428" font-family="'IBM Plex Mono',Menlo,monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#7a2e1f">03 &#183; DOCUMENT &#8594; UI &#8212; AIPET.STUDIO</text>
  <g font-family="'Noto Sans TC','PingFang TC',sans-serif">
    <rect x="64" y="452" width="240" height="88" fill="#fdfaf1" stroke="#1e1a15" stroke-width="2"/>
    <text x="184" y="488" font-size="20" font-weight="700" fill="#1e1a15" text-anchor="middle">wiki 設計文件</text>
    <text x="184" y="516" font-size="15" fill="#7a6a55" text-anchor="middle">判斷先寫下來</text>
    <line x1="304" y1="496" x2="404" y2="496" stroke="#4a3f30" stroke-width="2.5" marker-end="url(#a-ink)"/>
    <rect x="408" y="452" width="240" height="88" fill="#fdfaf1" stroke="#1e1a15" stroke-width="2"/>
    <text x="528" y="488" font-size="20" font-weight="700" fill="#1e1a15" text-anchor="middle">PatchOp 變更單</text>
    <text x="528" y="516" font-size="15" fill="#7a6a55" text-anchor="middle">理由 + 規格引用必填</text>
    <line x1="648" y1="496" x2="748" y2="496" stroke="#4a3f30" stroke-width="2.5" marker-end="url(#a-ink)"/>
    <rect x="752" y="452" width="200" height="88" fill="#fdfaf1" stroke="#1e1a15" stroke-width="2"/>
    <text x="852" y="488" font-size="20" font-weight="700" fill="#1e1a15" text-anchor="middle">畫面</text>
    <text x="852" y="516" font-size="15" fill="#7a6a55" text-anchor="middle">文件的投影</text>
    <!-- audit annotation -->
    <rect x="1000" y="452" width="216" height="88" fill="#fff" stroke="#c49a56" stroke-width="2"/>
    <text x="1108" y="484" font-size="17" font-weight="700" fill="#4a3f30" text-anchor="middle">Red Team 審計</text>
    <text x="1108" y="510" font-size="15" fill="#7a6a55" text-anchor="middle">反對必須引條文</text>
    <line x1="1000" y1="496" x2="956" y2="496" stroke="#c49a56" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#a-gray)"/>
    <!-- loop back -->
    <path d="M 852 540 L 852 616 L 184 616 L 184 544" fill="none" stroke="#7a2e1f" stroke-width="2.5" marker-end="url(#a-rust)"/>
    <text x="518" y="606" font-size="18" font-weight="700" fill="#7a2e1f" text-anchor="middle">決策 + rationale 寫回 wiki,才算閉環</text>
  </g>
</svg>
