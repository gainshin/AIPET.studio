<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="tb-t tb-d">
  <title id="tb-t">三節拍辯證</title>
  <desc id="tb-d">Builder 產候選、Auditor 引規格反對、Synthesis 由人三選一並寫回 wiki</desc>
  <rect width="1280" height="560" fill="#fdfaf1"/>
  <defs>
    <marker id="b-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4a3f30"/></marker>
    <marker id="b-rust" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7a2e1f"/></marker>
  </defs>
  <text x="64" y="66" font-family="'IBM Plex Mono',Menlo,monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#7a6a55">ONE FEATURE = ONE ROUND</text>

  <g font-family="'Noto Sans TC','PingFang TC',sans-serif">
    <!-- wiki node -->
    <rect x="64" y="180" width="176" height="180" fill="#f7f3ea" stroke="#1e1a15" stroke-width="2"/>
    <text x="152" y="252" font-family="'IBM Plex Mono',Menlo,monospace" font-size="18" font-weight="700" fill="#1e1a15" text-anchor="middle">wiki</text>
    <text x="152" y="282" font-size="16" fill="#7a6a55" text-anchor="middle">feature spec</text>
    <text x="152" y="306" font-size="16" fill="#7a6a55" text-anchor="middle">出發也回來</text>
    <line x1="240" y1="270" x2="316" y2="270" stroke="#4a3f30" stroke-width="2.5" marker-end="url(#b-ink)"/>

    <!-- beat 1 -->
    <rect x="320" y="150" width="248" height="240" fill="#fdfaf1" stroke="#1e1a15" stroke-width="2"/>
    <text x="344" y="200" font-family="'Noto Serif TC','Songti TC',serif" font-size="42" font-weight="800" fill="#c49a56">&#9312;</text>
    <text x="444" y="200" font-size="24" font-weight="700" fill="#1e1a15" text-anchor="middle">Builder</text>
    <line x1="344" y1="222" x2="544" y2="222" stroke="#e4dcc3" stroke-width="2"/>
    <text x="344" y="258" font-size="17" fill="#4a3f30">AI 從文件產出</text>
    <text x="344" y="286" font-size="17" fill="#4a3f30"><tspan font-weight="700">2–3 個可比較的候選</tspan></text>
    <text x="344" y="322" font-size="15" fill="#a89e87">不要求一次就對</text>
    <line x1="568" y1="270" x2="640" y2="270" stroke="#4a3f30" stroke-width="2.5" marker-end="url(#b-ink)"/>

    <!-- beat 2 -->
    <rect x="644" y="150" width="248" height="240" fill="#fdfaf1" stroke="#1e1a15" stroke-width="2"/>
    <text x="668" y="200" font-family="'Noto Serif TC','Songti TC',serif" font-size="42" font-weight="800" fill="#c49a56">&#9313;</text>
    <text x="770" y="200" font-size="24" font-weight="700" fill="#1e1a15" text-anchor="middle">Auditor</text>
    <line x1="668" y1="222" x2="868" y2="222" stroke="#e4dcc3" stroke-width="2"/>
    <text x="668" y="258" font-size="17" fill="#4a3f30">另一個 AI 提出反對:</text>
    <text x="668" y="286" font-size="17" fill="#4a3f30"><tspan font-weight="700">必須引用規格原文</tspan></text>
    <text x="668" y="322" font-size="15" fill="#a89e87">Red Team 必經,不收「感覺不對」</text>
    <line x1="892" y1="270" x2="964" y2="270" stroke="#4a3f30" stroke-width="2.5" marker-end="url(#b-ink)"/>

    <!-- beat 3 (human) -->
    <rect x="968" y="150" width="248" height="240" fill="#fff" stroke="#7a2e1f" stroke-width="3"/>
    <text x="992" y="200" font-family="'Noto Serif TC','Songti TC',serif" font-size="42" font-weight="800" fill="#7a2e1f">&#9314;</text>
    <text x="1096" y="200" font-size="24" font-weight="700" fill="#7a2e1f" text-anchor="middle">Synthesis</text>
    <line x1="992" y1="222" x2="1192" y2="222" stroke="#e8dcba" stroke-width="2"/>
    <text x="992" y="258" font-size="17" fill="#4a3f30"><tspan font-weight="700" fill="#7a2e1f">你</tspan>三選一:</text>
    <text x="992" y="286" font-size="17" fill="#4a3f30">採 A / 採 B / 都不採改規則</text>
    <text x="992" y="322" font-size="15" fill="#a89e87">rationale 必填,決策留痕</text>

    <!-- loop back -->
    <path d="M 1092 390 L 1092 470 L 152 470 L 152 364" fill="none" stroke="#7a2e1f" stroke-width="2.5" marker-end="url(#b-rust)"/>
    <text x="622" y="460" font-size="18" font-weight="700" fill="#7a2e1f" text-anchor="middle">決策沒寫回文件,不算完成</text>
  </g>
  <text x="64" y="530" font-family="'IBM Plex Mono',Menlo,monospace" font-size="14" letter-spacing="1" fill="#a89e87">BUILDER &#8594; AUDITOR &#8594; SYNTHESIS &#183; 最終決定權在人</text>
</svg>
